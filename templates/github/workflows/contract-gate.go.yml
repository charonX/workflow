name: Loop Contract Gate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  contract-gate:
    name: Loop Contract Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install dependencies
        run: go mod download

      # 1. 静态检查
      - name: Lint
        run: |
          go vet ./...
          # golangci-lint run

      # 2. 单元测试 + coverage
      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage report
        run: go tool cover -func=coverage.out

      # 3. E2E 测试
      - name: E2E tests
        run: go test -tags=e2e ./tests/e2e/ || true

      # 4. 契约签核文件存在性检查
      - name: Assertion signoff check
        run: |
          if grep -qE '\[build\]' <<< "${{ github.event.pull_request.title }}"; then
            test -f .aiassist/stories/*/signoff.md || {
              echo "❌ [build] PR 缺少 signoff.md"
              exit 1
            }
          fi

      # 5. 测试文件只读检查：实现 PR 不能修改测试
      - name: Test files read-only check
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          HAS_IMPL=false
          HAS_TEST=false

          for file in $CHANGED_FILES; do
            case "$file" in
              *_test.go|tests/*|e2e/*)
                HAS_TEST=true
                ;;
              *.go)
                HAS_IMPL=true
                ;;
            esac
          done

          if [ "$HAS_IMPL" = true ] && [ "$HAS_TEST" = true ]; then
            echo ""
            echo "❌ 双循环：一个 PR 不能同时修改实现代码和测试文件。"
            echo ""
            echo "请把测试修改拆到单独的 PR，或通过 /story 回流到 TEST 阶段。"
            echo ""
            exit 1
          fi
