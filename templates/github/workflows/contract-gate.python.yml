name: Loop Contract Gate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  contract-gate:
    name: Loop Contract Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        if: ${{ hashFiles('requirements.txt') != '' }}

      - name: Install dependencies (pyproject)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
        if: ${{ hashFiles('pyproject.toml') != '' }}

      # 1. 静态检查
      - name: Lint
        run: |
          flake8 src/ || true
          black --check src/ || true
        if: ${{ hashFiles('requirements.txt', 'pyproject.toml') != '' }}

      - name: Type check
        run: mypy src/
        if: ${{ hashFiles('pyproject.toml') != '' }}

      # 2. 单元测试 + coverage
      - name: Unit tests
        run: pytest --cov=src --cov-report=term-missing

      # 3. E2E 测试
      - name: E2E tests
        run: pytest tests/e2e/ || true

      # 4. 契约签核文件存在性检查
      - name: Assertion signoff check
        run: |
          if grep -qE '\[build\]' <<< "${{ github.event.pull_request.title }}"; then
            test -f .aiassist/stories/*/assertion-signoff.md || {
              echo "❌ [build] PR 缺少 assertion-signoff.md"
              exit 1
            }
          fi

      # 5. 测试文件只读检查：实现 PR 不能修改测试
      - name: Test files read-only check
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          HAS_IMPL=false
          HAS_TEST=false

          for file in $CHANGED_FILES; do
            case "$file" in
              test/*|tests/*|__tests__/*|*.test.*|*.spec.*|e2e/*|spec/*|integration/*)
                HAS_TEST=true
                ;;
              src/*|app/*|lib/*|pages/*|components/*|server/*|client/*|api/*|services/*|workers/*|tools/*|bin/*)
                HAS_IMPL=true
                ;;
            esac
          done

          if [ "$HAS_IMPL" = true ] && [ "$HAS_TEST" = true ]; then
            echo ""
            echo "❌ 双循环：一个 PR 不能同时修改实现代码和测试文件。"
            echo ""
            echo "请把测试修改拆到单独的 PR，或通过 /story 回流到 TEST 阶段。"
            echo ""
            exit 1
          fi
