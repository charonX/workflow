name: TAC Contract Gate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  contract-gate:
    name: Test-as-Contract Gate
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Install dependencies
        run: |
          # 根据项目实际依赖管理工具调整：CocoaPods / Swift Package Manager
          # pod install
          # 或 swift package resolve
          echo "Install dependencies here"

      # 1. 静态检查
      - name: Lint
        run: |
          # swiftlint
          echo "Run swiftlint here"

      # 2. 单元测试 + coverage
      - name: Unit tests
        run: |
          xcodebuild test -project MyApp.xcodeproj -scheme MyAppTests -destination 'platform=iOS Simulator,name=iPhone 17' CODE_COVERAGE=YES

      # 3. E2E 测试
      - name: E2E tests
        run: |
          xcodebuild test -project MyApp.xcodeproj -scheme MyAppUITests -destination 'platform=iOS Simulator,name=iPhone 17'

      # 4. 契约签核文件存在性检查
      - name: Assertion signoff check
        run: |
          if grep -qE '\[tac-build\]' <<< "${{ github.event.pull_request.title }}"; then
            test -f .aiassist/stories/*/assertion-signoff.md || {
              echo "❌ [tac-build] PR 缺少 assertion-signoff.md"
              exit 1
            }
          fi

      # 5. 观感签核文件存在性检查
      - name: Feel signoff check
        run: |
          if grep -qE '\[tac-feel\]' <<< "${{ github.event.pull_request.title }}"; then
            test -f .aiassist/stories/*/feel-signoff.md || {
              echo "❌ [tac-feel] PR 缺少 feel-signoff.md"
              exit 1
            }
          fi

      # 6. 测试文件只读检查：实现 PR 不能修改测试
      - name: Test files read-only check
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          HAS_IMPL=false
          HAS_TEST=false

          for file in $CHANGED_FILES; do
            case "$file" in
              *Tests/*|*UITests/*|*Test*|*Spec*)
                HAS_TEST=true
                ;;
              *)
                # Swift 项目默认把源码和测试分开，这里保守地把非测试文件视为实现
                # 如需更精确，请按实际目录结构调整
                if [[ "$file" =~ \.(swift|m|mm|c|h)$ ]]; then
                  HAS_IMPL=true
                fi
                ;;
            esac
          done

          if [ "$HAS_IMPL" = true ] && [ "$HAS_TEST" = true ]; then
            echo ""
            echo "❌ 双循环：一个 PR 不能同时修改实现代码和测试文件。"
            echo ""
            echo "请把测试修改拆到单独的 PR，或通过 /tac-story 回流到 TEST 阶段。"
            echo ""
            exit 1
          fi
